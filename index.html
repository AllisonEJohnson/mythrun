<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Mythrun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, HUD pinned to corners, menus as centered iron-and-ash panels. Single dark look by design. */
:root{
  --night:#07090e;
  --panel:rgba(12,13,17,.93);
  --line:rgba(176,140,82,.35);
  --ink:#e6dfd2;
  --muted:#8f8a80;
  --gold:#c9a25a;
  --blood:#9e2b25;
  --hp:#a8322b;
  --arcane:#7fb7c9;
  --moss:#8fae6a;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --ui:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
button{font-family:var(--ui);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.hud-tl{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:6px;width:min(300px,52vw)}
.lvl-name{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 2px #000}
.lives{font-size:16px;letter-spacing:2px;color:#c43a30;text-shadow:0 1px 2px #000}
.lives span{color:rgba(255,255,255,.18)}
.bar{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.bar>div{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(180deg,#c4463c,var(--hp) 60%,#6e1c17);transition:width .15s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.abilities{display:flex;gap:6px}
.ab{position:relative;min-width:46px;padding:0 6px;height:30px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.55);border-radius:2px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;overflow:hidden}
.ab i{position:absolute;inset:auto 0 0 0;height:0;background:rgba(255,255,255,.2)}
.ab small{position:absolute;top:0;right:3px;font-size:9px;color:var(--muted)}
.hud-tr{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));text-align:right;display:grid;gap:2px;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hud-tr .pts{font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.hud-tr .pts small{font-size:13px;color:var(--ink);font-weight:600;margin-left:3px}
.hud-tr div{font-size:14px;font-weight:600}
.coin{color:#e2b450}
#pauseBtn{pointer-events:auto;justify-self:end;margin-top:4px;background:rgba(0,0,0,.5);color:var(--ink);border:1px solid rgba(255,255,255,.22);border-radius:2px;font-size:12px;padding:4px 10px;letter-spacing:.06em;text-transform:uppercase}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));width:min(420px,46vw);text-align:center}
#bossBar .boss-name{font-family:var(--display);font-size:14px;letter-spacing:.12em;color:#d9b48a;text-shadow:0 1px 3px #000;margin-bottom:4px}
#bossBar .bar>div{background:linear-gradient(180deg,#9a5a2a,#5a2a12)}
#objective{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));font-size:15px;font-weight:600;letter-spacing:.03em;text-shadow:0 1px 3px #000;color:var(--ink);opacity:.9;text-align:center;width:min(520px,80vw)}
#toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,34px);letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.9);opacity:0;transition:opacity .3s;text-align:center;width:90vw}
#toast.show{opacity:1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted);text-shadow:0 1px 2px #000;white-space:nowrap}
#hint b{color:var(--ink)}
#crosshair{position:absolute;left:50%;top:46%;width:6px;height:6px;margin:-3px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px rgba(160,20,15,.8);opacity:0;transition:opacity .25s}
#lowhp{position:absolute;inset:0;box-shadow:inset 0 0 90px 20px rgba(160,20,15,.5);animation:pulse 1s infinite alternate}
#shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.floater{position:absolute;left:0;top:0;font-weight:700;font-size:18px;text-shadow:0 1px 3px #000,0 0 2px #000;white-space:nowrap;will-change:transform}

/* Touch controls */
#touch{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.25)}
.tbtns{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
.tbtns button{height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,10,14,.6);color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tbtns button:active{background:rgba(201,162,90,.45)}
.tbtns .small{grid-column:span 2;height:38px;border-radius:19px}

/* Screens */
#screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(30,36,50,.55),rgba(3,4,7,.9));overflow:auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.panel{width:min(780px,100%);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:28px clamp(18px,4vw,36px);box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.6);display:grid;gap:18px}
.panel.wide{width:min(1000px,100%)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,72px);letter-spacing:.08em;margin:0;line-height:1;color:var(--gold);text-wrap:balance;text-shadow:0 3px 0 #2a1c0a,0 0 30px rgba(201,162,90,.25)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:.05em;margin:0;line-height:1.1;color:var(--gold);text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink)}
.lede{font-size:17px;line-height:1.5;color:var(--ink);max-width:62ch;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,#d1ab62,#97722f);color:#1a1206;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:12px 22px;border-radius:2px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(255,255,255,.25)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:#d9796a;border-color:rgba(217,121,106,.45)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.course{border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:12px;display:grid;gap:4px;background:rgba(255,255,255,.02);text-align:left;color:var(--ink);align-content:start}
.course b{font-family:var(--display);font-size:15px;letter-spacing:.04em}
.course span{font-size:13px;color:var(--muted)}
.course.open{border-color:var(--gold);cursor:pointer}
.course.open:hover{background:rgba(201,162,90,.1)}
.course.locked{opacity:.5}
.loadout{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.loadout b{color:var(--ink)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px;font-size:14px;color:var(--muted)}
.controls b{color:var(--ink);display:inline-block;min-width:96px}
.tally{display:grid;gap:6px;font-size:16px;font-variant-numeric:tabular-nums}
.tally div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(255,255,255,.1);padding-bottom:5px}
.tally .total{font-size:22px;font-weight:700;color:var(--gold);border-bottom:none}
.bank{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bank b{font-size:28px;color:var(--gold)}
.bank b.coin{color:#e2b450}
.bank span{margin-right:10px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.skill{border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:12px;display:grid;gap:7px;background:rgba(255,255,255,.02);align-content:start}
.skill.equipped{border-color:var(--gold);background:rgba(201,162,90,.07)}
.skill header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.skill header b{font-family:var(--display);font-size:16px;letter-spacing:.03em}
.tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--arcane);border:1px solid rgba(127,183,201,.45);padding:1px 5px;border-radius:2px;white-space:nowrap}
.tag.gold{color:var(--gold);border-color:var(--line)}
.skill p{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:6px;border-radius:1px;background:rgba(255,255,255,.1)}
.pips i.on{background:var(--gold)}
.skill .val{font-size:14px;font-variant-numeric:tabular-nums}
.skill .val em{font-style:normal;color:var(--moss)}
.skill button{border:1px solid var(--gold);background:rgba(201,162,90,.12);color:var(--gold);font-weight:700;font-size:14px;padding:7px;border-radius:2px;letter-spacing:.04em}
.skill button:hover:not(:disabled){background:rgba(201,162,90,.28)}
.skill button:disabled{border-color:rgba(255,255,255,.12);color:var(--muted);background:transparent;cursor:not-allowed}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:2px}
.tabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(201,162,90,.1)}
.board{overflow-x:auto}
.board table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.board th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.board td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.board tr.me td{color:var(--gold);font-weight:700}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:#e0a99f}
.note{font-size:13px;color:var(--muted);margin:0}
.builder-tools{display:flex;flex-wrap:wrap;gap:6px}
.builder-tools button{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.03);color:var(--ink);font-weight:600;font-size:13px;padding:6px 10px;border-radius:2px}
.builder-tools button i{width:14px;height:14px;border-radius:2px;display:inline-block;flex:none}
.builder-tools button small{color:var(--muted);font-variant-numeric:tabular-nums}
.builder-tools button[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,162,90,.15);color:var(--gold)}
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px;background:#0b0c10;touch-action:pan-x}
.map-wrap canvas{display:block;touch-action:none;cursor:crosshair}
.map-ends{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.field input{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:var(--ink);font:600 16px var(--ui);padding:8px 10px;border-radius:2px;width:min(280px,100%)}
.field input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (prefers-reduced-motion: reduce){#lowhp{animation:none}#toast{transition:none}}
@media (max-width:560px){#hint{display:none}#hudKills,#hudGems{display:none}.hud-tl{width:58vw}.ab{min-width:0;padding:0 5px;font-size:10px}.abilities{gap:4px}.hud-tr .pts{font-size:20px}#objective{top:calc(118px + env(safe-area-inset-top,0px));font-size:13px}#bossBar{top:calc(66px + env(safe-area-inset-top,0px));width:70vw}}
</style>

<div id="game"></div>
<div id="hud" hidden>
  <div id="shade"></div>
  <div id="lowhp" hidden></div>
  <div id="vignette"></div>
  <div class="hud-tl">
    <div class="lvl-name" id="hudLevel">Course 1</div>
    <div class="lives" id="hudLives"></div>
    <div class="bar"><div id="hpFill"></div><span id="hpText">100 / 100</span></div>
    <div class="abilities">
      <div class="ab" id="abMelee"><b>Sword</b><i></i></div>
      <div class="ab" id="abBolt"><b>Bolt</b><i></i></div>
      <div class="ab" id="abDash"><b>Dash</b><i></i></div>
      <div class="ab" id="abPotion"><b>Potion</b><small>0</small></div>
    </div>
  </div>
  <div class="hud-tr">
    <div class="pts"><span id="hudPts">0</span><small>pts</small></div>
    <div class="coin" id="hudCoins">● 0</div>
    <div id="hudGems">◆ 0 / 0</div>
    <div id="hudKills">Creatures 0 / 0</div>
    <div id="hudTime">0:00</div>
    <button id="pauseBtn" type="button">Pause</button>
  </div>
  <div id="bossBar" hidden><div class="boss-name" id="bossName">Blackmoor Dragon</div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="objective"></div>
  <div id="toast"></div>
  <div id="crosshair"></div>
  <div id="hint"><b>WASD</b> move · <b>Mouse</b> look · <b>Space</b> jump · <b>Click / J</b> melee · <b>Right-click / K</b> ranged · <b>Shift</b> dash · <b>R</b> potion · <b>Esc</b> pause</div>
  <div id="floaters"></div>
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div class="tbtns">
      <button type="button" data-act="potion" class="small">Potion</button>
      <button type="button" data-act="ranged">Shoot</button>
      <button type="button" data-act="dash">Dash</button>
      <button type="button" data-act="melee">Strike</button>
      <button type="button" data-act="jump">Jump</button>
    </div>
  </div>
</div>
<div id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const screenEl = $('#screen');
if (typeof THREE === 'undefined') {
  screenEl.innerHTML = '<div class="panel"><h2>Could not load the 3D engine</h2><p class="lede">The three.js library did not load. Check your connection and reload the page.</p></div>';
  return;
}

/* ================= Helpers ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const GRAV = 30;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= Heroes, weapons, skills ================= */
// Heroes adjust the base stats; skill upgrades are shared across every hero.
const HEROES = {
  knight: { name: 'Knight', desc: 'Balanced armor and blade. Carries a shield that blocks a little of every hit.', cost: 0, hp: 0, speed: 0, jump: 0, melee: 1, ranged: 1, def: 0.05 },
  ranger: { name: 'Ranger', desc: 'Fast, high-jumping and deadly at range, but fragile up close.', cost: 80, hp: -20, speed: 1.2, jump: 0.7, melee: 0.8, ranged: 1.35, def: 0 },
  berserker: { name: 'Berserker', desc: 'Huge health and brutal melee, but slower on the course.', cost: 100, hp: 50, speed: -0.6, jump: -0.3, melee: 1.35, ranged: 0.8, def: 0.08 },
};
const MELEE = {
  sword: { name: 'Longsword', short: 'Sword', desc: 'Balanced swings with a good arc.', cost: 0, dmg: 1, cd: 0.42, reach: 2.3, arc: 0.3, kb: 7 },
  axe: { name: 'War axe', short: 'Axe', desc: 'Slow, crushing blows that hit all around you.', cost: 70, dmg: 1.7, cd: 0.78, reach: 2.5, arc: -0.4, kb: 11 },
  spear: { name: 'Spear', short: 'Spear', desc: 'Fast thrusts with long reach in a narrow line.', cost: 50, dmg: 0.85, cd: 0.3, reach: 3.4, arc: 0.75, kb: 5 },
};
const RANGED = {
  bolt: { name: 'Arcane bolt', short: 'Bolt', desc: 'Homing magic missile.', cost: 0, dmg: 1, cd: 0.55, speed: 30, aim: 0.45 },
  crossbow: { name: 'Crossbow', short: 'Xbow', desc: 'Heavy quarrels that pierce through every creature in a line.', cost: 70, dmg: 1.8, cd: 1.0, speed: 48, aim: 0.25, pierce: true },
  flask: { name: 'Fire flask', short: 'Flask', desc: 'Lobbed flask that bursts into fire, hurting everything nearby.', cost: 90, dmg: 1.4, cd: 1.1, speed: 17, aim: 0.5, splash: 2.8 },
};
const SUPPLIES = {
  potion: { name: 'Healing potion', desc: 'Restores half your health. Drink with R. Carry up to 3.', cost: 15, max: 3, key: 'potions' },
  life: { name: 'Extra life', desc: 'Adds one life to your next run. Store up to 3.', cost: 30, max: 3, key: 'extraLives' },
};
const BASE_LIVES = 3;

// base cost grows 55% per level. val(level) gives the stat before hero and weapon bonuses.
const SKILLS = [
  { id: 'speed', name: 'Speed', desc: 'How fast you run.', max: 6, base: 80, val: l => 7 + 0.8 * l, fmt: v => v.toFixed(1) + ' m/s' },
  { id: 'jump', name: 'Jump', desc: 'How high you leap.', max: 5, base: 80, val: l => 11 + 0.75 * l, fmt: v => (v * v / (2 * GRAV)).toFixed(2) + ' m high' },
  { id: 'health', name: 'Health', desc: 'Maximum hit points.', max: 8, base: 90, val: l => 100 + 25 * l, fmt: v => v + ' HP' },
  { id: 'melee', name: 'Melee attack', desc: 'Damage of your melee weapon.', max: 8, base: 100, val: l => 20 + 7 * l, fmt: v => v + ' base damage' },
  { id: 'ranged', name: 'Ranged attack', desc: 'Damage of your ranged weapon.', max: 8, base: 100, val: l => 12 + 6 * l, fmt: v => v + ' base damage' },
  { id: 'defense', name: 'Defense', desc: 'Armor that blocks part of every hit.', max: 6, base: 110, val: l => 0.06 * l, fmt: v => Math.round(v * 100) + '% blocked' },
  { id: 'dash', name: 'Dash', desc: 'Quick burst with no damage taken. Faster recharge.', max: 5, base: 90, val: l => 3 - 0.4 * l, fmt: v => v.toFixed(1) + 's recharge', suggested: true },
  { id: 'regen', name: 'Regeneration', desc: 'Heal over time after 3s without being hit.', max: 5, base: 120, val: l => 1 * l, fmt: v => v.toFixed(1) + ' HP/s', suggested: true },
  { id: 'crit', name: 'Critical hit', desc: 'Chance for any attack to deal double damage.', max: 5, base: 120, val: l => 0.06 * l, fmt: v => Math.round(v * 100) + '% chance', suggested: true },
  { id: 'double', name: 'Double jump', desc: 'Jump again in mid-air. Opens secret routes.', max: 1, base: 400, val: l => l, fmt: v => v ? 'Unlocked' : 'Locked', suggested: true },

      for (let k = 0; k < Math.round((w_ + d) / 3); k++) { // rubble on the edges
        const rb = mesh(rockGeo(0, 0.35), MAT.stone); const sc = rand(0.15, 0.4); rb.scale.set(sc, sc * 0.6, sc);
        const side = Math.random() < 0.5; rb.position.set(side ? rand(-w_ / 2, w_ / 2) : (Math.random() < 0.5 ? -1 : 1) * (w_ / 2 - 0.3), h / 2 + sc * 0.3, side ? (Math.random() < 0.5 ? -1 : 1) * (d / 2 - 0.3) : rand(-d / 2, d / 2)); g.add(rb);
      }
    } else if (pd.k === 'wood') {
      const plank = mesh(texturedBox(w_, h * 0.6, d, 3), MAT.wood); plank.position.y = h * 0.2; g.add(plank);
      for (let s = -1; s <= 1; s += 2) { const beam = mesh(texturedBox(w_ + 0.2, h * 0.5, 0.3, 2), MAT.wood); beam.position.set(0, -h * 0.2, s * d * 0.35); g.add(beam); }
      const rm = basic(0x5fb8d6, { transparent: true, opacity: 0.6, side: THREE.DoubleSide }); rm.userData.own = true;
      const rune = mesh(new THREE.RingGeometry(0.45, 0.6, 24), rm, false); rune.rotation.x = -Math.PI / 2; rune.position.y = h / 2 + 0.02; g.add(rune);
    } else if (pd.k === 'wall') {
      const wl = mesh(texturedBox(w_, h, d, 2.5), MAT.brick); g.add(wl);
      const cap = mesh(texturedBox(w_ + 0.2, 0.25, d + 0.3, 2), MAT.stone); cap.position.y = h / 2; g.add(cap);
      for (let x = -w_ / 2 + 0.6; x < w_ / 2 - 0.3; x += 1.8) { const mr = mesh(texturedBox(0.9, 0.6, d + 0.1, 1.5), MAT.brick); mr.position.set(x, h / 2 + 0.4, 0); g.add(mr); }
    } else if (pd.k === 'pillar') {
      const col = mesh(new THREE.CylinderGeometry(w_ * 0.42, w_ * 0.48, h, 12, 1), MAT.stone); g.add(col);
      const cap = mesh(texturedBox(w_ * 1.15, 0.3, d * 1.15, 2), MAT.stone); cap.position.y = h / 2 - 0.15; g.add(cap);
      const base = mesh(texturedBox(w_ * 1.2, 0.3, d * 1.2, 2), MAT.stone); base.position.y = -h / 2 + 0.15; g.add(base);
    } else {
      const s = mesh(texturedBox(w_, h, d, 2.5), MAT.stone); g.add(s);
    }
    if (pd.k !== 'wood' && pd.k !== 'pillar' && pd.k !== 'wall' && def.castle && pd.p[1] - h / 2 - def.castle.floorY > 1) { // masonry piers down into the castle pit
      const depth = pd.p[1] - h / 2 - def.castle.floorY;
      const pw = Math.min(w_ * 0.55, 3.2), pdp = Math.min(d * 0.55, 3.2);
      const pier = mesh(texturedBox(pw, depth, pdp, 3), MAT.brick); pier.position.y = -h / 2 - depth / 2; pier.castShadow = false; g.add(pier);
      if (pd.island) {
        const corbel = mesh(texturedBox(w_ * 0.85, 0.6, d * 0.85, 3), MAT.stoneDark); corbel.position.y = -h / 2 - 0.3; g.add(corbel);
        for (let s = -1; s <= 1; s += 2) { const sp = mesh(texturedBox(0.8, depth, 0.8, 3), MAT.brick); sp.position.set(s * (w_ / 2 - 0.6), -h / 2 - depth / 2, s * (d / 2 - 0.6)); sp.castShadow = false; g.add(sp); }
      }
    }
    g.position.set(...pd.p);
    root.add(g);
    const c = { g, half: V(w_ / 2, h / 2, d / 2), base: V(...pd.p), box: new THREE.Box3(), delta: V(), move: pd.move || null, def: pd };
    c.box.setFromCenterAndSize(c.base, V(w_, h, d));
    w.colliders.push(c);
    if (c.move) w.movers.push(c);
  });

  const addCollider = (cx, cy, cz, sx, sy, sz) => { const c = { g: null, half: V(sx / 2, sy / 2, sz / 2), base: V(cx, cy, cz), box: new THREE.Box3(), delta: V(), move: null }; c.box.setFromCenterAndSize(c.base, V(sx, sy, sz)); w.colliders.push(c); };

  (def.statues || []).forEach(([x, y, z]) => { // stone knight statues on plinths
    const g = new THREE.Group();
    const plinth = mesh(texturedBox(1.1, 0.8, 1.1, 1.5), MAT.stone); plinth.position.y = 0.4; g.add(plinth);
    const st = makeHero('knight'); st.g.traverse(o => { if (o.isMesh) { o.material = MAT.stone; o.castShadow = true; } }); st.trail.visible = false;
    const sw = makeWeapon('sword'); sw.traverse(o => { if (o.isMesh) o.material = MAT.stone; }); st.weaponHolder.add(sw); st.arm.rotation.set(-1.4, 0, 0);
    st.g.scale.setScalar(1.25); st.g.position.y = 0.8; g.add(st.g);
    g.position.set(x, y, z); root.add(g);
    addCollider(x, y + 1.5, z, 1.1, 3, 1.1);
  });

  // braziers with real firelight
  const flameM = new THREE.MeshBasicMaterial({ color: 0xc8501a, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false }); flameM.userData.own = true;
  const flameCore = new THREE.MeshBasicMaterial({ color: 0xc89a50, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }); flameCore.userData.own = true;
  (def.braziers || []).forEach(([x, y, z]) => {
    const g = new THREE.Group();
    const post = mesh(new THREE.CylinderGeometry(0.08, 0.14, 1.1, 8), MAT.iron); post.position.y = 0.55; g.add(post);
    const bowl = mesh(new THREE.CylinderGeometry(0.42, 0.22, 0.3, 12, 1, true), MAT.iron); bowl.position.y = 1.2; g.add(bowl);
    const coals = mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.05, 12), basic(0xff5a1a)); coals.position.y = 1.3; g.add(coals);
    const f1 = new THREE.Mesh(G.cone, flameM); f1.scale.set(0.3, 0.8, 0.3); f1.position.y = 1.7; g.add(f1);
    const f2 = new THREE.Mesh(G.cone, flameCore); f2.scale.set(0.15, 0.45, 0.15); f2.position.y = 1.55; g.add(f2);
    const light = new THREE.PointLight(0xff8a3a, 2.2, 14, 2); light.position.y = 2; g.add(light);
    g.position.set(x, y, z); root.add(g);
    w.lights.push({ light, f1, f2, ph: rand(0, 10) });
    addCollider(x, y + 0.7, z, 0.5, 1.4, 0.5);
  });

  if (def.castle) buildCastle(def.castle, root);
  // mist in the castle pit
  for (let i = 0; i < 3; i++) {
    const mm = new THREE.MeshBasicMaterial({ map: TEX.mist.map, transparent: true, opacity: 0.35 - i * 0.08, depthWrite: false, color: 0x8a96b0 }); mm.userData.own = true;
    mm.map = TEX.mist.map.clone(); mm.map.needsUpdate = true; mm.map.repeat.set(3, 3);
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(def.castle ? 40 : 500, def.castle ? 180 : 500), mm); pl.rotation.x = -Math.PI / 2; pl.position.set(0, -13 - i * 2.5, -70); root.add(pl);
    w.mist.push({ m: mm, sp: 0.004 + i * 0.002 });
  }
  // embers drifting near the player
  {
    const n = 220, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) pos.set([rand(-25, 25), rand(-5, 15), rand(-25, 25)], i * 3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pm = new THREE.PointsMaterial({ color: 0xffa060, size: 0.09, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }); pm.userData.own = true;
    w.embers = new THREE.Points(g, pm); root.add(w.embers);
  }

  def.hazards.forEach(hd => {
    if (hd.type === 'spinner') {
      const g = new THREE.Group();
      const post = mesh(new THREE.CylinderGeometry(0.35, 0.5, 1.4, 12), MAT.iron); post.position.y = 0.7; g.add(post);
      const arm = new THREE.Group(); arm.position.y = 0.65; g.add(arm);
      const bar = mesh(new THREE.BoxGeometry(hd.radius * 2, 0.28, 0.28), MAT.iron); arm.add(bar);
      for (let k = -4; k <= 4; k++) { if (!k) continue; const sp = mesh(G.cone, MAT.steel); sp.scale.set(0.1, 0.42, 0.1); sp.position.set(k * hd.radius / 4.5, 0.3, 0); arm.add(sp); const sp2 = sp.clone(); sp2.rotation.x = Math.PI; sp2.position.y = -0.3; arm.add(sp2); }
      g.position.set(...hd.p); root.add(g);
      w.hazards.push({ type: 'spinner', def: hd, g, arm, angle: 0, center: V(...hd.p), cd: 0 });
    } else if (hd.type === 'spikes') {
      const g = new THREE.Group();
      const plate = mesh(texturedBox(hd.w, 0.06, hd.d, 2), MAT.iron); plate.position.y = 0.02; g.add(plate);
      const spikes = new THREE.Group(); g.add(spikes);
      const sm = MAT.steel.clone(); sm.userData.own = true;
      for (let x = -hd.w / 2 + 0.35; x < hd.w / 2; x += 0.7) for (let z = -hd.d / 2 + 0.33; z < hd.d / 2; z += 0.65) {
        const sp = mesh(G.cone, sm); sp.scale.set(0.13, 0.6, 0.13); sp.position.set(x, 0.3, z); spikes.add(sp);
      }
      g.position.set(...hd.p); root.add(g);
      w.hazards.push({ type: 'spikes', def: hd, g, spikes, sm, center: V(...hd.p) });
    }
  });

  def.checkpoints.forEach(p => {
    const g = new THREE.Group();
    const stone = mesh(new THREE.CylinderGeometry(0.22, 0.38, 1.9, 4), MAT.stone); stone.position.y = 0.95; stone.rotation.y = Math.PI / 4; g.add(stone);
    const fm = basic(0x2a3440); fm.userData.own = true;
    const rune = mesh(new THREE.OctahedronGeometry(0.22, 0), fm, false); rune.position.y = 2.2; g.add(rune);
    g.position.set(...p); root.add(g);
    w.checkpoints.push({ pos: V(...p), g, flame: rune, fm, on: false });
  });

  const gemMat = new THREE.MeshStandardMaterial({ color: 0x3fd6b0, emissive: 0x0e5a48, metalness: 0.2, roughness: 0.1, transparent: true, opacity: 0.92 });
  const bigGemMat = new THREE.MeshStandardMaterial({ color: 0xe04a5a, emissive: 0x5a0a14, metalness: 0.2, roughness: 0.1 });
  gemMat.userData.own = bigGemMat.userData.own = true;
  def.gems.forEach(gd => {
    const big = !Array.isArray(gd) && gd.big; const p = Array.isArray(gd) ? gd : gd.p;
    const m = mesh(G.gem, big ? bigGemMat : gemMat, false); if (big) m.scale.setScalar(1.7);
    m.position.set(...p); root.add(m);
    w.gems.push({ m, base: V(...p), big, taken: false, pull: false, phase: rand(0, TAU) });
  });
  (def.coins || []).forEach(p => spawnCoin(V(...p), null));

  def.enemies.forEach(ed => {
    if (ed.tower) { // ruined stone tower rising from the mist, with the archer on top
      const [x, top, z] = ed.tower, bottom = def.fallY - 4, h = top - bottom;
      const tg = new THREE.Group();
      const shaft = mesh(new THREE.CylinderGeometry(1.0, 1.35, h, 14, 1), MAT.stoneDark); shaft.position.y = -h / 2; tg.add(shaft);
      const deck = mesh(new THREE.CylinderGeometry(1.35, 1.1, 0.4, 14), MAT.flag); deck.position.y = -0.2; tg.add(deck);
      for (let k = 0; k < 8; k++) { if (k === 3) continue; const a = k / 8 * TAU; const m = mesh(texturedBox(0.45, 0.6, 0.35, 1), MAT.stone); m.position.set(Math.cos(a) * 1.2, 0.3, Math.sin(a) * 1.2); m.rotation.y = -a; tg.add(m); }
      tg.position.set(x, top, z); root.add(tg);
      addCollider(x, (top + bottom) / 2, z, 2.3, h, 2.3);
    }
    const e = makeEnemy(ed, def, w.diff); w.enemies.push(e);
  });

  // goal portal: a stone arch
  {
    const g = new THREE.Group();
    for (let s = -1; s <= 1; s += 2) { const col = mesh(texturedBox(0.7, 4.2, 0.7, 2), MAT.stone); col.position.set(s * 2.1, 2.1, 0); g.add(col); }
    const lintel = mesh(texturedBox(5.2, 0.7, 0.9, 2), MAT.stone); lintel.position.y = 4.5; g.add(lintel);
    const steps = mesh(texturedBox(5, 0.3, 2, 2), MAT.flag); steps.position.y = 0.15; g.add(steps);
    const dm = new THREE.MeshBasicMaterial({ map: TEX.mist.map.clone(), color: 0x5a1a1a, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }); dm.userData.own = true; dm.map.needsUpdate = true;
    const disc = mesh(new THREE.PlaneGeometry(3.5, 3.9), dm, false); disc.position.y = 2.15; g.add(disc);
    const glow = new THREE.PointLight(0xff3a2a, 1.4, 10, 2); glow.position.set(0, 2, 1); g.add(glow);
    g.position.set(...def.goal); root.add(g);
    w.goal = { g, disc, dm, glow, pos: V(...def.goal), open: !def.enemies.some(e => e.boss) };
  }
  return w;
}

function buildCastle(C, root) {
  const { halfW, front, back, floorY, top } = C;
  const len = front - back, midZ = (front + back) / 2, wallH = top - floorY, T_ = 3;
  const solid = (cx, cy, cz, sx, sy, sz) => { const c = { g: null, half: V(sx / 2, sy / 2, sz / 2), base: V(cx, cy, cz), box: new THREE.Box3(), delta: V(), move: null }; c.box.setFromCenterAndSize(c.base, V(sx, sy, sz)); world.colliders.push(c); };
  world.towers = [];
  const wall = (cx, cz, sx, sz) => { const m = mesh(texturedBox(sx, wallH, sz, 3), MAT.brick); m.position.set(cx, floorY + wallH / 2, cz); m.castShadow = false; root.add(m); solid(cx, floorY + wallH / 2, cz, sx, wallH + 6, sz); };
  wall(-halfW - T_ / 2, midZ, T_, len); wall(halfW + T_ / 2, midZ, T_, len);
  wall(0, back - T_ / 2, halfW * 2 + T_ * 2, T_); wall(0, front + T_ / 2, halfW * 2 + T_ * 2, T_);
  const floor = mesh(texturedBox(halfW * 2, 0.5, len, 4), MAT.flag); floor.position.set(0, floorY, midZ); floor.castShadow = false; root.add(floor);
  // battlements
  const merlonSpots = [];
  for (let z = front; z > back; z -= 2.2) for (const sx of [-1, 1]) merlonSpots.push([sx * (halfW + T_ / 2), z]);
  for (let x = -halfW; x < halfW; x += 2.2) for (const z of [back - T_ / 2, front + T_ / 2]) merlonSpots.push([x, z]);
  const merlons = new THREE.InstancedMesh(texturedBox(1.2, 1.4, T_ + 0.2, 1.5), MAT.brick, merlonSpots.length);
  const mtx = new THREE.Matrix4();
  merlonSpots.forEach(([x, z], i) => { mtx.makeTranslation(x, top + 0.7, z); merlons.setMatrixAt(i, mtx); });
  merlons.receiveShadow = true; root.add(merlons);
  // round towers with slate roofs
  const roofGeo = new THREE.ConeGeometry(4.2, 8, 14);
  for (let z = front; z >= back; z -= 34) for (const sx of [-1, 1]) {
    const tw = mesh(new THREE.CylinderGeometry(3.4, 3.8, wallH + 8, 16, 1), MAT.brick); tw.position.set(sx * (halfW + 1.5), floorY + (wallH + 8) / 2, z); tw.castShadow = false; root.add(tw);
    solid(sx * (halfW + 1.5), floorY + (wallH + 8) / 2, z, 6.8, wallH + 14, 6.8); world.towers.push({ x: sx * (halfW + 1.5), z, r: 3.9 });
    const roof = mesh(roofGeo, MAT.slate, false); roof.position.set(sx * (halfW + 1.5), top + 12, z); root.add(roof);
  }
  // great keep beyond the back wall
  const keep = mesh(texturedBox(24, 44, 14, 3), MAT.brick, false); keep.position.set(0, floorY + 22, back - 12); root.add(keep);
  const keepRoof = mesh(new THREE.ConeGeometry(14, 14, 4), MAT.slate, false); keepRoof.rotation.y = Math.PI / 4; keepRoof.position.set(0, floorY + 51, back - 12); root.add(keepRoof);
  // lit windows, banners and wall torches on the inner faces
  const winM = new THREE.MeshBasicMaterial({ color: 0x9a4a14 }); winM.userData.own = true;
  const darkWin = new THREE.MeshBasicMaterial({ color: 0x0a0a0e }); darkWin.userData.own = true;
  const winGeo = new THREE.PlaneGeometry(0.9, 1.6);
  const torchM = new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }); torchM.userData.own = true;
  for (const sx of [-1, 1]) {
    const face = sx * halfW - sx * 0.02, rotY = -sx * Math.PI / 2;
    for (let z = front - 6; z > back; z -= 7) for (const y of [7, 12]) {
      const wn = new THREE.Mesh(winGeo, Math.random() < 0.25 ? winM : darkWin); wn.position.set(face, y + rand(-0.3, 0.3), z + rand(-1, 1)); wn.rotation.y = rotY; root.add(wn);
    }
    for (let z = front - 12; z > back; z -= 18) {
      const bn = mesh(new THREE.PlaneGeometry(2.2, 7, 1, 6), MAT.banner, false); bn.position.set(face - sx * 0.05, 3, z); bn.rotation.y = rotY; root.add(bn);
      const crest = mesh(new THREE.CircleGeometry(0.6, 20), MAT.gold, false); crest.position.set(face - sx * 0.07, 4.2, z); crest.rotation.y = rotY; root.add(crest);
    }
    for (let z = front - 3; z > back; z -= 12) {
      const sc = mesh(G.cyl, MAT.iron); sc.scale.set(0.1, 0.5, 0.1); sc.position.set(face - sx * 0.2, 2, z); root.add(sc);
      const fl = new THREE.Mesh(G.cone, torchM); fl.scale.set(0.18, 0.45, 0.18); fl.position.set(face - sx * 0.2, 2.5, z); root.add(fl);
    }
  }
  // the great gate on the back wall, behind the exit
  const gate = mesh(new THREE.PlaneGeometry(6, 8), new THREE.MeshStandardMaterial({ map: TEX.wood.map, color: 0x6a5040, roughness: 0.9 }), false);
  gate.position.set(0, 8.5 + 4, back + 0.02); root.add(gate);
}

function spawnCoin(pos, vel) {
  const m = mesh(G.coin, MAT.gold, false); m.rotation.x = Math.PI / 2; m.position.copy(pos); world.root.add(m);
  const k = { m, base: pos.clone(), vel: vel ? vel.clone() : null, ground: pos.y, taken: false, pull: false, phase: rand(0, TAU) };
  world.coins.push(k); return k;
}

function own(m) { m.userData.own = true; return m; }

function makeZombie() {
  const g = new THREE.Group(); const flashM = [];
  const skin = own(std(0x5c6b4a, { map: TEX.skin.map, bumpMap: TEX.skin.bump, bumpScale: 0.05, roughness: 0.8 })); flashM.push(skin);
  const rags = own(std(0x3a3328, { roughness: 1, side: THREE.DoubleSide })); flashM.push(rags);
  const pants = own(std(0x2a2c30, { roughness: 1 })); flashM.push(pants);
  const torso = mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.65, 10), rags); torso.position.y = 1.12; torso.rotation.x = 0.25; g.add(torso);
  const hips = mesh(new THREE.CylinderGeometry(0.23, 0.25, 0.25, 10), pants); hips.position.y = 0.78; g.add(hips);
  const neck = mesh(G.cyl, skin); neck.scale.set(0.07, 0.15, 0.07); neck.position.set(0, 1.5, 0.1); g.add(neck);
  const head = mesh(G.sphere, skin); head.scale.set(0.16, 0.19, 0.18); head.position.set(0.04, 1.66, 0.14); head.rotation.z = 0.3; g.add(head);
  const jaw = mesh(G.box, skin); jaw.scale.set(0.16, 0.06, 0.14); jaw.position.set(0.04, 1.5, 0.2); jaw.rotation.x = 0.3; g.add(jaw);
  const eyeM = basic(0xe8f070);
  for (let s = -1; s <= 1; s += 2) { const eye = mesh(G.sphere, eyeM, false); eye.scale.setScalar(0.03); eye.position.set(0.04 + s * 0.07, 1.69, 0.31); g.add(eye); }
  const hair = mesh(G.sphere, std(0x1a1814, { roughness: 1 })); hair.scale.set(0.15, 0.08, 0.15); hair.position.set(0.02, 1.8, 0.1); g.add(hair);
  const arms = [], legs = [];
  for (let s = -1; s <= 1; s += 2) {
    const sh = new THREE.Group(); sh.position.set(s * 0.32, 1.36, 0.08); g.add(sh);
    const sleeve = mesh(G.cyl, rags); sleeve.scale.set(0.075, 0.3, 0.075); sleeve.rotation.x = Math.PI / 2; sleeve.position.z = 0.15; sh.add(sleeve);
    const fore = mesh(G.cyl, skin); fore.scale.set(0.055, 0.35, 0.055); fore.rotation.x = Math.PI / 2; fore.position.z = 0.45; sh.add(fore);
    const hand = mesh(G.sphere, skin); hand.scale.set(0.07, 0.05, 0.09); hand.position.z = 0.65; sh.add(hand);
    sh.rotation.x = -0.15; arms.push(sh);
    const hip = new THREE.Group(); hip.position.set(s * 0.13, 0.72, 0); g.add(hip);
    const leg = mesh(G.cyl, pants); leg.scale.set(0.08, 0.68, 0.08); leg.position.y = -0.34; hip.add(leg);
    const foot = mesh(G.box, std(0x1e1a16)); foot.scale.set(0.11, 0.07, 0.22); foot.position.set(0, -0.68, 0.05); hip.add(foot);
    legs.push(hip);
  }
  const flap = mesh(new THREE.PlaneGeometry(0.4, 0.35), rags); flap.position.set(0.05, 0.8, -0.24); flap.rotation.x = 0.2; g.add(flap);
  return { g, flashM, arms, legs };
}

function makeEnemy(ed, def, diff) {
  const st = ENEMY_STATS[ed.t];
  const model = ed.t === 'zombie' ? makeZombie() : ed.t === 'pig' ? makePig() : ed.t === 'skeleton' ? makeSkeleton() : ed.t === 'minotaur' ? makeMinotaur() : makeDragon();
  const e = Object.assign(model, {
    type: ed.t, boss: !!ed.boss, name: st.name, r: st.r, pts: Math.round(st.pts * diff), coins: st.coins,
    hp: st.hp * diff, maxHp: st.hp * diff, alive: true, dying: 0, state: 'idle', st: 0, cd: rand(0.5, 2), cd2: 2,
    kb: V(), flash: 0, t: rand(0, 10), facing: Math.PI, dir: V(), aggro: false, diff,
  });
  if (ed.tower) { e.tower = true; e.ground = ed.tower[1]; e.home = V(...ed.tower); }
  else if (ed.area) {
    const [x0, x1, z0, z1] = ed.area, m = 0.4 + e.r;
    e.ground = 0; e.bounds = { minX: x0 + m, maxX: x1 - m, minZ: z0 + m, maxZ: z1 - m }; e.home = V(ed.p[0], 0, ed.p[1]);
  }
  else if (ed.plat !== undefined) {
    const pd = def.platforms[ed.plat];
    e.ground = pd.p[1] + pd.s[1] / 2;
    const m = 0.4 + e.r;
    e.bounds = { minX: pd.p[0] - pd.s[0] / 2 + m, maxX: pd.p[0] + pd.s[0] / 2 - m, minZ: pd.p[2] - pd.s[2] / 2 + m, maxZ: pd.p[2] + pd.s[2] / 2 - m };
    e.home = V(ed.p[0], e.ground, ed.p[1]);
  } else { e.ground = null; e.home = V(...ed.p); }
  e.pos = e.g.position; e.pos.copy(e.home);
  e.wander = e.home.clone();
  e.g.rotation.y = Math.PI;
  const bar = new THREE.Group();
  const bg = mesh(new THREE.PlaneGeometry(1, 0.1), basic(0x000000, { transparent: true, opacity: 0.6, depthTest: false }), false);
  const fgGeo = new THREE.PlaneGeometry(1, 0.1); fgGeo.translate(0.5, 0, 0);
  const fg = mesh(fgGeo, basic(e.boss ? 0xb8642a : 0xb0302a, { depthTest: false }), false); fg.position.x = -0.5;

  world.root.add(e.g); world.root.add(bar);

}

      const cy = e.type === 'skeleton' ? e.pos.y + 1.1 : e.type === 'zombie' ? e.pos.y + 1.0 : e.type === 'pig' ? e.pos.y + 0.8 : e.pos.y + 2;

      if (Math.hypot(b.m.position.x - e.pos.x, (b.m.position.y - cy) * 0.7, b.m.position.z - e.pos.z) < hr) {
        if (b.kind === 'flask') { explodeFlask(b.m.position); b.life = 0; break; }
        damageEnemy(e, stat('ranged'), V(b.vel.x, 0, b.vel.z).normalize(), 4); b.hit.add(e);
        burst(b.m.position, b.kind === 'crossbow' ? 0x8a8a8a : 0x5fa8ff, 6, 3, b.kind !== 'crossbow');
        if (b.kind !== 'crossbow') { b.life = 0; break; }
      }
    }
    for (const o of world.orbs) { if (!o.dead && b.life > 0 && b.m.position.distanceTo(o.m.position) < 0.6) { o.dead = true; if (b.kind !== 'crossbow') b.life = 0; burst(o.m.position, 0x6a4a2a, 6, 3); } }
    if (b.life > 0) for (const c of world.colliders) { if (c.box.containsPoint(b.m.position)) { if (b.kind === 'flask') explodeFlask(b.m.position); else burst(b.m.position, 0x8a8a8a, 4, 2); b.life = 0; break; } }
    if (b.life <= 0 && b.kind === 'flask' && !b.exploded && b.m.position.y > world.def.fallY) { b.exploded = true; }
    if (b.life <= 0) world.root.remove(b.m);
  }
  world.bolts = world.bolts.filter(b => b.life > 0);
  for (const o of world.orbs) {
    o.life -= dt; o.m.position.addScaledVector(o.vel, dt);
    if (!o.dead) for (const c of world.colliders) if (c.box.containsPoint(o.m.position)) { o.dead = true; break; }
    if (!o.dead && P.alive) {
      const p = o.m.position; const dy = p.y - (P.pos.y + 0.9);
      if (Math.hypot(p.x - P.pos.x, dy * 0.6, p.z - P.pos.z) < 0.75) { o.dead = true; hurtPlayer(o.dmg, p, 5); burst(p, 0x6a4a2a, 6, 3); }
    }
    if (o.dead || o.life <= 0) { world.root.remove(o.m); o.dead = true; }
  }
  world.orbs = world.orbs.filter(o => !o.dead);
  for (const p of world.parts) {
    p.life -= dt; p.vel.y -= 14 * dt; p.m.position.addScaledVector(p.vel, dt); p.m.rotation.x += dt * 6; p.m.scale.setScalar(Math.max(0.01, p.life / p.max));
    if (p.life <= 0) world.root.remove(p.m);
  }
  world.parts = world.parts.filter(p => p.life > 0);
}

function updatePickups(dt) {
  const reach = stat('magnet');
  const c = V(P.pos.x, P.pos.y + 0.9, P.pos.z);
  for (const g of world.gems) {
    if (g.taken) continue;
    const t = clock + g.phase; g.m.rotation.y = t * 2;
    const d = g.m.position.distanceTo(c);
    if (!g.pull && d < reach && P.alive) g.pull = true;
    if (g.pull) {
      g.m.position.lerp(c, 1 - Math.exp(-10 * dt));
      if (d < 0.6) {
        g.taken = true; g.m.visible = false; const v = g.big ? 50 : 10; run.gems++; run.gemPts += v; run.points += v;
        floatText('+' + v, V(c.x, c.y + 1.2, c.z), g.big ? '#ff7a8a' : '#6ef0d0', g.big ? 24 : 16);
        if (g.big) toast('Secret gem!', 1.6);
      }
    } else g.m.position.y = g.base.y + Math.sin(t * 2.2) * 0.15;
  }
  for (const k of world.coins) {
    if (k.taken) continue;
    k.m.rotation.z = clock * 3 + k.phase;
    if (k.vel) { // dropped coins fly out, then settle
      k.vel.y -= GRAV * dt; k.m.position.addScaledVector(k.vel, dt); k.vel.x *= 0.98; k.vel.z *= 0.98;
      for (const col of world.colliders) { const b = col.box; if (k.vel.y < 0 && k.m.position.x > b.min.x && k.m.position.x < b.max.x && k.m.position.z > b.min.z && k.m.position.z < b.max.z && k.m.position.y < b.max.y + 0.25 && k.m.position.y > b.max.y - 0.6) { k.m.position.y = b.max.y + 0.25; k.vel = null; k.base.copy(k.m.position); break; } }
      if (k.vel && k.m.position.y < world.def.fallY) { k.taken = true; k.m.visible = false; continue; }
    }
    const d = k.m.position.distanceTo(c);
    if (!k.pull && d < reach + 0.3 && P.alive && !(k.vel && k.vel.y > 0)) { k.pull = true; k.vel = null; }
    if (k.pull) {
      k.m.position.lerp(c, 1 - Math.exp(-12 * dt));
      if (d < 0.6) { k.taken = true; k.m.visible = false; run.coins++; floatText('+1', V(c.x + rand(-0.3, 0.3), c.y + 1, c.z), '#e2b450', 14); }
    } else if (!k.vel) k.m.position.y = k.base.y + Math.sin(clock * 2 + k.phase) * 0.08;
  }
  for (const cp of world.checkpoints) { cp.flame.rotation.y += dt * 2; cp.flame.position.y = 2.2 + Math.sin(clock * 3) * 0.08; }
  const gl = world.goal;
  gl.dm.map.offset.x += dt * (gl.open ? 0.25 : 0.04); gl.dm.map.offset.y += dt * (gl.open ? 0.1 : 0.02);
  if (gl.open) { gl.dm.color.setHex(0x6ab8ff); gl.glow.color.setHex(0x6ab8ff); gl.glow.intensity = 2 + Math.sin(clock * 4) * 0.4; }
  if (gl.open && P.alive && Math.hypot(P.pos.x - gl.pos.x, P.pos.z - gl.pos.z) < 1.7 && Math.abs(P.pos.y - gl.pos.y) < 2.5) finishCourse();
  else if (!gl.open && Math.hypot(P.pos.x - gl.pos.x, P.pos.z - gl.pos.z) < 2.2 && toastTimer <= 0) toast('Sealed. Defeat the boss first.', 1.4);
}

function updateAmbience(dt) {
  if (!world) return;
  for (const l of world.lights) {
    const f = 0.8 + Math.sin(clock * 9 + l.ph) * 0.1 + Math.sin(clock * 23 + l.ph * 2) * 0.08;
    l.light.intensity = 2.2 * f; l.f1.scale.set(0.3 * f, 0.8 * f, 0.3 * f); l.f2.scale.y = 0.45 * f; l.f1.rotation.y += dt * 3;
  }
  for (const m of world.mist) { m.m.map.offset.x += m.sp * dt * 10; m.m.map.offset.y += m.sp * dt * 4; }
  if (world.embers) {
    const p = world.embers.geometry.attributes.position; const cx = P.pos.x, cy = P.pos.y, cz = P.pos.z;
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i) + Math.sin(clock + i) * 0.01, y = p.getY(i) + dt * 0.6, z = p.getZ(i);
      if (y > cy + 14 || Math.abs(x - cx) > 25 || Math.abs(z - cz) > 25) { x = cx + rand(-25, 25); y = cy - 6; z = cz + rand(-25, 25); }
      p.setXYZ(i, x, y, z);
    }
    p.needsUpdate = true;
  }
}

function updateCamera(dt) {
  const target = V(P.pos.x, P.pos.y + 1.5, P.pos.z);
  const off = V(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(camDist);
  const want = target.clone().add(off);
  // over-the-shoulder offset to the right
  want.add(V(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(0.6));
  const C = world && world.def.castle;
  if (C) { // keep the camera inside the castle so it never looks through a wall
    want.x = clamp(want.x, -C.halfW + 0.4, C.halfW - 0.4); want.z = clamp(want.z, C.back + 0.4, C.front - 0.4);
    for (const t of world.towers || []) { const dx = want.x - t.x, dz = want.z - t.z, d = Math.hypot(dx, dz); if (d < t.r + 0.4 && d > 0.01) { want.x = t.x + dx / d * (t.r + 0.4); want.z = t.z + dz / d * (t.r + 0.4); } }
    want.x = clamp(want.x, -C.halfW + 0.4, C.halfW - 0.4);
  }
  camera.position.lerp(want, 1 - Math.exp(-12 * dt));
  camera.lookAt(target.clone().add(V(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(0.6)));
  sky.position.copy(camera.position);
  moon.position.copy(P.pos).addScaledVector(MOON_DIR, 60); moon.target.position.copy(P.pos);
}

function updateHud(dt) {
  $('#hpFill').style.width = (P.hp / P.maxHp * 100) + '%';
  $('#hpText').textContent = `${Math.ceil(P.hp)} / ${P.maxHp}`;
  $('#lowhp').hidden = P.hp / P.maxHp > 0.3;

  flashT = Math.max(0, flashT - dt); $('#vignette').style.opacity = flashT > 0 ? flashT / 0.35 : 0;
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('#toast').classList.remove('show'); }
}
function updateFloaters(dt) {
  const w = window.innerWidth, h = window.innerHeight;
  for (const f of floaters) {
    f.life -= dt; f.pos.y += dt * 1.2;
    const p = f.pos.clone().project(camera);
    if (p.z > 1) f.el.style.display = 'none';
    else { f.el.style.display = ''; f.el.style.transform = `translate(${(p.x * 0.5 + 0.5) * w}px,${(-p.y * 0.5 + 0.5) * h}px) translate(-50%,-50%)`; f.el.style.opacity = Math.min(1, f.life * 2.5); }
    if (f.life <= 0) f.el.remove();
  }
  for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].life <= 0) floaters.splice(i, 1);
}

/* ================= Flow ================= */
function loseLife() {
  run.lives--;
  if (run.lives > 0) {
    P.hp = P.maxHp; P.pos.copy(P.respawn); P.vel.set(0, 0, 0); P.inv = 2;
    toast(`Life lost · ${run.lives} left`, 1.8); burst(V(P.pos.x, P.pos.y + 1, P.pos.z), 0x9aa8c8, 14, 4, true);
    return;
  }
  P.alive = false; hero.g.visible = true; hero.g.rotation.z = 1.4;
  burst(V(P.pos.x, P.pos.y + 1, P.pos.z), 0x5a1a14, 18, 5);
  setTimeout(() => { if (state === 'playing' && !P.alive) showDefeat(); }, 1300);
}
function finishCourse() {
  const def = world.def, diff = world.diff;
  const timeBonus = Math.max(0, Math.round((def.parTime - run.time) * 1.5));
  const clear = Math.round(150 * diff);
  const noFall = run.falls === 0 ? 75 : 0;
  const livesBonus = run.lives * 25;
  const total = run.points + timeBonus + clear + noFall + livesBonus;
  const coinsClear = 15;
  save.points += total; save.coins += run.coins + coinsClear;
  save.unlocked = Math.max(save.unlocked, Math.min(COURSES.length, run.idx + 2));
  const prev = save.best[def.id];
  const newBest = !prev || total > prev.score;
  if (newBest) save.best[def.id] = { score: total, time: Math.round(run.time) };
  const board = save.board[def.id] = save.board[def.id] || [];
  const entry = { time: Math.round(run.time * 100) / 100, score: total, hero: save.hero, date: new Date().toISOString().slice(0, 10), id: Date.now() };
  board.push(entry); board.sort((a, b) => a.time - b.time); save.board[def.id] = board.slice(0, 10);
  const rank = save.board[def.id].findIndex(r => r.id === entry.id) + 1;
  persist();
  setState('results');
  showResults({ def, timeBonus, clear, noFall, livesBonus, total, newBest, coinsClear, rank, entryId: entry.id });
}

function fmtTime(s, short) { const m = Math.floor(s / 60), r = s - m * 60; return short ? `${m}:${String(Math.floor(r)).padStart(2, '0')}` : `${m}:${r.toFixed(2).padStart(5, '0')}`; }

    <p class="note">Upgrades apply to every hero. Your hero and weapons then add their own bonuses on top.</p>
    <div class="row">
      ${continueRow(from)}
      <button type="button" class="btn ghost" id="shopBtn">Shop · ${save.coins} coins</button>
      ${confirmReset ? `<span class="confirm">Erase all points, coins, upgrades and items? <button type="button" class="btn danger" id="resetYes">Erase</button><button type="button" class="btn ghost" id="resetNo">Keep</button></span>`
      : `<button type="button" class="btn danger" id="resetBtn">Reset progress</button>`}
    </div>
  </div>`;
  screenEl.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const s = skillById(b.dataset.buy), l = lvlOf(s.id), c = costOf(s, l);
    if (l < s.max && save.points >= c) { save.points -= c; save.upgrades[s.id] = l + 1; persist(); showUpgrades(from); }
  });
  wireContinue(from);
  $('#shopBtn').onclick = () => showShop(from);
  if ($('#resetBtn')) $('#resetBtn').onclick = () => showUpgrades(from, true);
  if ($('#resetYes')) $('#resetYes').onclick = () => { save = defaultSave(); persist(); equipHero(); showUpgrades(from); };
  if ($('#resetNo')) $('#resetNo').onclick = () => showUpgrades(from);
}
function showShop(from, tab = 'heroes') {
  setState('menu');
  const tabs = [['heroes', 'Heroes'], ['melee', 'Melee weapons'], ['ranged', 'Ranged weapons'], ['supplies', 'Supplies']];
  const itemCard = (kind, id, it) => {
    const owned = save.owned[kind].includes(id), eqKey = kind === 'heroes' ? 'hero' : kind, equipped = save[eqKey] === id;
    let stats = '';
    if (kind === 'heroes') stats = [it.hp ? `${it.hp > 0 ? '+' : ''}${it.hp} HP` : '', it.speed ? `${it.speed > 0 ? '+' : ''}${it.speed} speed` : '', it.jump ? `${it.jump > 0 ? '+' : ''}${it.jump} jump` : '', it.melee !== 1 ? `×${it.melee} melee` : '', it.ranged !== 1 ? `×${it.ranged} ranged` : '', it.def ? `+${Math.round(it.def * 100)}% defense` : ''].filter(Boolean).join(' · ') || 'Even stats';
    else if (kind === 'melee') stats = `×${it.dmg} damage · ${it.reach} m reach · ${it.cd}s swing`;
    else stats = `×${it.dmg} damage · ${it.cd}s reload${it.splash ? ` · ${it.splash} m blast` : ''}${it.pierce ? ' · pierces' : ''}`;
    const btn = equipped ? `<button type="button" disabled>Equipped</button>` : owned ? `<button type="button" data-equip="${kind}:${id}">Equip</button>`
      : `<button type="button" data-buyitem="${kind}:${id}" ${save.coins < it.cost ? 'disabled' : ''}>Buy · ${it.cost} coins</button>`;
    return `<div class="skill ${equipped ? 'equipped' : ''}"><header><b>${it.name}</b>${equipped ? '<span class="tag gold">Equipped</span>' : owned ? '<span class="tag">Owned</span>' : ''}</header><p>${it.desc}</p><div class="val">${stats}</div>${btn}</div>`;
  };
  let body = '';
  if (tab === 'supplies') body = Object.entries(SUPPLIES).map(([id, it]) => {
    const have = save[it.key] || 0, full = have >= it.max;
    return `<div class="skill"><header><b>${it.name}</b><span class="tag gold">${have} / ${it.max}</span></header><p>${it.desc}</p><button type="button" data-supply="${id}" ${full || save.coins < it.cost ? 'disabled' : ''}>${full ? 'Full' : `Buy · ${it.cost} coins`}</button></div>`;
  }).join('');
  else { const src = tab === 'heroes' ? HEROES : tab === 'melee' ? MELEE : RANGED; body = Object.entries(src).map(([id, it]) => itemCard(tab, id, it)).join(''); }
  screenEl.innerHTML = `<div class="panel wide">
    <div class="row" style="justify-content:space-between">
      <div style="display:grid;gap:6px"><div class="eyebrow">Spend coins</div><h2>The Wanderer's Shop</h2></div>
      ${bankHtml()}
    </div>
    <div class="tabs">${tabs.map(([k, n]) => `<button type="button" data-tab="${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>
    <div class="skills">${body}</div>
    ${loadoutHtml()}
    <div class="row">${continueRow(from)}<button type="button" class="btn ghost" id="upBtn">Upgrades · ${save.points} pts</button></div>
  </div>`;
  screenEl.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showShop(from, b.dataset.tab));
  screenEl.querySelectorAll('[data-equip]').forEach(b => b.onclick = () => { const [k, id] = b.dataset.equip.split(':'); save[k === 'heroes' ? 'hero' : k] = id; persist(); equipHero(); showShop(from, tab); });
  screenEl.querySelectorAll('[data-buyitem]').forEach(b => b.onclick = () => {
    const [k, id] = b.dataset.buyitem.split(':'); const it = (k === 'heroes' ? HEROES : k === 'melee' ? MELEE : RANGED)[id];
    if (save.coins >= it.cost && !save.owned[k].includes(id)) { save.coins -= it.cost; save.owned[k].push(id); save[k === 'heroes' ? 'hero' : k] = id; persist(); equipHero(); showShop(from, tab); }
  });
  screenEl.querySelectorAll('[data-supply]').forEach(b => b.onclick = () => {
    const it = SUPPLIES[b.dataset.supply]; if (save.coins >= it.cost && (save[it.key] || 0) < it.max) { save.coins -= it.cost; save[it.key] = (save[it.key] || 0) + 1; persist(); showShop(from, tab); }
  });
  wireContinue(from);
  $('#upBtn').onclick = () => showUpgrades(from);
}

/* ================= Course builder ================= */
// The castle floor is a grid of 2 m squares: 69 columns from the entrance (column 0) to the great gate, 10 rows across.
const GRID = { cols: 69, rows: 10 };
const TOOLS = [
  { id: 'wall', name: 'Wall', color: '#8a7f78', glyph: '' , max: 400 },
  { id: 'pillar', name: 'Pillar', color: '#b7b0a8', glyph: 'P', max: 60 },
  { id: 'spinner', name: 'Spinning blade', color: '#c9a25a', glyph: 'B', max: 12 },
  { id: 'spikes', name: 'Spike trap', color: '#9aa0a8', glyph: '^', max: 80 },
  { id: 'zombie', name: 'Bad pig', color: '#c08070', glyph: '🐗', max: 30 },
  { id: 'skeleton', name: 'Skeleton archer', color: '#d6ccb4', glyph: 'S', max: 8 },
  { id: 'boss', name: 'Dragon boss', color: '#a0522d', glyph: 'D', max: 1 },
  { id: 'gem', name: 'Gem', color: '#3fd6b0', glyph: '◆', max: 80 },
  { id: 'coin', name: 'Coin', color: '#e2b450', glyph: '●', max: 80 },
  { id: 'torch', name: 'Torch', color: '#ff8a3a', glyph: 'T', max: 10 },
  { id: 'statue', name: 'Statue', color: '#6f6a68', glyph: 'K', max: 12 },
  { id: 'checkpoint', name: 'Checkpoint', color: '#7fd8ff', glyph: 'C', max: 6 },
  { id: 'start', name: 'Start', color: '#7ee08a', glyph: '▶', max: 1 },
  { id: 'exit', name: 'Exit gate', color: '#6ab8ff', glyph: '⛩', max: 1 },
  { id: 'erase', name: 'Eraser', color: 'transparent', glyph: '' },
];
const toolById = id => TOOLS.find(t => t.id === id);
function exampleDesign() {
  const cells = {}, put = (c, r, t) => { cells[c + ',' + r] = t; };
  put(1, 4, 'start'); put(67, 4, 'exit'); put(2, 0, 'statue'); put(2, 9, 'statue'); put(0, 2, 'torch'); put(0, 7, 'torch');
  for (let c = 3; c < 11; c++) put(c, 4, 'gem');
  put(8, 2, 'zombie'); put(9, 7, 'zombie');
  for (let r = 0; r < 10; r++) if (r < 3 || r > 6) put(12, r, 'wall');
  put(16, 1, 'skeleton'); put(18, 8, 'coin'); put(18, 1, 'coin');
  for (let r = 0; r < 10; r++) { put(21, r, 'spikes'); put(24, r, 'spikes'); }
  put(27, 4, 'checkpoint'); put(26, 1, 'torch'); put(26, 8, 'torch');
  put(31, 2, 'spinner'); put(35, 7, 'spinner'); put(33, 4, 'gem'); put(37, 4, 'gem');
  for (let r = 0; r < 10; r++) if (r !== 7 && r !== 8) put(40, r, 'wall');
  for (let c = 43; c <= 53; c += 3) { put(c, 2, 'pillar'); put(c, 7, 'pillar'); }
  put(46, 4, 'zombie'); put(50, 5, 'zombie'); put(48, 9, 'skeleton'); put(45, 4, 'coin'); put(51, 4, 'coin');
  for (let r = 0; r < 10; r++) if (r < 4 || r > 5) put(56, r, 'wall');
  put(57, 4, 'checkpoint'); put(58, 0, 'torch'); put(58, 9, 'torch');
  put(62, 4, 'boss'); put(60, 1, 'zombie'); put(60, 8, 'zombie');
  for (const [c, r] of [[64, 2], [64, 7], [66, 1], [66, 8]]) put(c, r, 'gem');
  return { name: 'Course 2', cells };
}
const cellPos = (c, r) => [-9 + 2 * r, 9 - 2 * c]; // world x, z of a square's centre
function makeCustomDef() {
  const D = save.custom2 || exampleDesign();
  const area = [-10, 10, -128, 12];
  const def = {
    id: 2, name: D.name || 'Course 2', blurb: 'A castle course of your own design.', difficulty: 1.6, parTime: 200, fallY: -14,
    sky: COURSES[0].sky, fog: COURSES[0].fog, fogDensity: 0.012, castle: { halfW: 10, front: 12, back: -128, floorY: -0.5, top: 16 },
    start: [0, 0, 8], goal: [0, 0, -125], platforms: [{ p: [0, -0.5, -58], s: [20, 1, 140], k: 'flag' }],
    statues: [], braziers: [], checkpoints: [], hazards: [], gems: [], coins: [], enemies: [],
  };
  let spin = 0;
  for (const [k, t] of Object.entries(D.cells)) {
    const [c, r] = k.split(',').map(Number); const [x, z] = cellPos(c, r);
    switch (t) {
      case 'wall': def.platforms.push({ p: [x, 1.6, z], s: [2, 3.2, 2], k: 'wall' }); break;
      case 'pillar': def.platforms.push({ p: [x, 1.5, z], s: [1.2, 3, 1.2], k: 'pillar' }); break;
      case 'spinner': def.hazards.push({ type: 'spinner', p: [x, 0, z], radius: 3, speed: spin++ % 2 ? -1 : 1 }); break;
      case 'spikes': def.hazards.push({ type: 'spikes', p: [x, 0, z], w: 2, d: 2, phase: (c % 3) * 0.9 }); break;
      case 'zombie': def.enemies.push({ t: 'pig', p: [x, z], area }); break;
      case 'skeleton': def.enemies.push({ t: 'skeleton', tower: [x, 4.5, z] }); break;
      case 'boss': def.enemies.push({ t: 'dragon', p: [x, z], area, boss: true }); break;
      case 'gem': def.gems.push([x, 0.8, z]); break;
      case 'coin': def.coins.push([x, 0.5, z]); break;
      case 'torch': def.braziers.push([x, 0, z]); break;
      case 'statue': def.statues.push([x, 0, z]); break;
      case 'checkpoint': def.checkpoints.push([x, 0, z]); break;
      case 'start': def.start = [x, 0, z]; break;
      case 'exit': def.goal = [x, 0, z]; break;
    }
  }
  return def;
}
let builderTool = 'wall';
function showBuilder(confirmClear = false) {
  setState('menu');
  if (!save.custom2) { save.custom2 = exampleDesign(); persist(); }
  const D = save.custom2;
  const counts = {}; for (const t of Object.values(D.cells)) counts[t] = (counts[t] || 0) + 1;
  screenEl.innerHTML = `<div class="panel wide">
    <div class="row" style="justify-content:space-between">
      <div style="display:grid;gap:6px"><div class="eyebrow">Course builder</div><h2>Design course 2</h2></div>
      <label class="field" for="courseName">Course name <input id="courseName" maxlength="32" value="${esc(D.name || 'Course 2')}"></label>
    </div>
    <p class="note">Pick something, then click or drag on the castle floor to place it. Each square is 2 m. Clicking a filled square replaces it, and the Eraser clears it. Everything saves as you go. If you place the dragon, the exit gate stays sealed until it's slain.</p>
    <div class="builder-tools">${TOOLS.map(t => `<button type="button" data-tool="${t.id}" aria-pressed="${t.id === builderTool}"><i style="background:${t.color};${t.id === 'erase' ? 'border:1px dashed #888' : ''}"></i>${t.name}${t.max && t.max < 100 ? ` <small>${counts[t.id] || 0}/${t.max}</small>` : ''}</button>`).join('')}</div>
    <div class="map-ends"><span>◀ Entrance</span><span>Great gate ▶</span></div>
    <div class="map-wrap"><canvas id="mapCanvas"></canvas></div>
    <div class="row">
      <button type="button" class="btn" id="playCustom">Play ${esc(D.name || 'Course 2')}</button>
      <button type="button" class="btn ghost" id="titleBtn">Course map</button>
      <button type="button" class="btn ghost" id="exampleBtn">Load example layout</button>
      ${confirmClear ? `<span class="confirm">Erase the whole layout? <button type="button" class="btn danger" id="clearYes">Erase</button><button type="button" class="btn ghost" id="clearNo">Keep</button></span>`
      : `<button type="button" class="btn danger" id="clearBtn">Clear floor</button>`}
    </div>
  </div>`;
  const cv = $('#mapCanvas'), ctx = cv.getContext('2d');
  const cs = 24, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = GRID.cols * cs * dpr; cv.height = GRID.rows * cs * dpr; cv.style.width = GRID.cols * cs + 'px'; cv.style.height = GRID.rows * cs + 'px';
  ctx.scale(dpr, dpr);
  const draw = () => {
    ctx.fillStyle = '#1c1d22'; ctx.fillRect(0, 0, GRID.cols * cs, GRID.rows * cs);
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    for (let c = 0; c <= GRID.cols; c++) { ctx.beginPath(); ctx.moveTo(c * cs + 0.5, 0); ctx.lineTo(c * cs + 0.5, GRID.rows * cs); ctx.stroke(); }
    for (let r = 0; r <= GRID.rows; r++) { ctx.beginPath(); ctx.moveTo(0, r * cs + 0.5); ctx.lineTo(GRID.cols * cs, r * cs + 0.5); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    for (let c = 0; c < GRID.cols; c += 10) ctx.fillText(String(c * 2) + ' m', c * cs + 3, GRID.rows * cs - 3);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const [k, t] of Object.entries(D.cells)) {
      const [c, r] = k.split(',').map(Number); const tl = toolById(t); if (!tl) continue;
      const x = c * cs, y = r * cs;
      if (t === 'wall') { ctx.fillStyle = tl.color; ctx.fillRect(x, y, cs, cs); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y + cs / 2 - 1, cs, 2); continue; }
      ctx.fillStyle = tl.color; ctx.globalAlpha = t === 'spikes' ? 0.55 : 0.9;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x + 2, y + 2, cs - 4, cs - 4, 4); else ctx.rect(x + 2, y + 2, cs - 4, cs - 4); ctx.fill(); ctx.globalAlpha = 1;
      if (t === 'spinner') { ctx.strokeStyle = 'rgba(201,162,90,.35)'; ctx.beginPath(); ctx.arc(x + cs / 2, y + cs / 2, cs * 1.5, 0, TAU); ctx.stroke(); }
      ctx.fillStyle = '#111'; ctx.font = 'bold 13px ' + getComputedStyle(document.body).fontFamily; ctx.fillText(tl.glyph, x + cs / 2, y + cs / 2 + 1);
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  };
  draw();
  const paint = e => {
    const rect = cv.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / cs), r = Math.floor((e.clientY - rect.top) / cs);
    if (c < 0 || r < 0 || c >= GRID.cols || r >= GRID.rows) return;
    const key = c + ',' + r, tl = toolById(builderTool);
    if (builderTool === 'erase') { if (!D.cells[key]) return; delete D.cells[key]; }
    else {
      if (D.cells[key] === builderTool) return;
      const n = Object.values(D.cells).filter(t => t === builderTool).length;
      if (tl.max === 1) { for (const k2 in D.cells) if (D.cells[k2] === builderTool) delete D.cells[k2]; }
      else if (n >= tl.max) { return; }
      D.cells[key] = builderTool;
    }
    persist(); draw();
    const counts2 = {}; for (const t of Object.values(D.cells)) counts2[t] = (counts2[t] || 0) + 1;
    screenEl.querySelectorAll('[data-tool] small').forEach(sm => { const id = sm.parentElement.dataset.tool; sm.textContent = `${counts2[id] || 0}/${toolById(id).max}`; });
  };
  let down = false;
  cv.addEventListener('pointerdown', e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (err) { } paint(e); });
  cv.addEventListener('pointermove', e => { if (down) paint(e); });
  const up = () => { down = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  screenEl.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { builderTool = b.dataset.tool; screenEl.querySelectorAll('[data-tool]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#courseName').addEventListener('input', e => { D.name = e.target.value.trim() || 'Course 2'; persist(); $('#playCustom').textContent = 'Play ' + D.name; });
  $('#playCustom').onclick = () => startCourse(1);
  $('#titleBtn').onclick = showTitle;
  $('#exampleBtn').onclick = () => { const n = D.name; save.custom2 = exampleDesign(); save.custom2.name = n; persist(); showBuilder(); };
  if ($('#clearBtn')) $('#clearBtn').onclick = () => showBuilder(true);
  if ($('#clearYes')) $('#clearYes').onclick = () => { D.cells = {}; persist(); showBuilder(); };
  if ($('#clearNo')) $('#clearNo').onclick = () => showBuilder();
}

/* ================= Loop ================= */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  clock += dt;
  if (world && state === 'playing') {
    T += dt; run.time += dt;
    updateMovers();
    if (P.alive) updatePlayer(dt);
    updateHazards(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updatePickups(dt);
    updateHud(dt);
  }
  updateAmbience(dt);
  if (world) updateCamera(state === 'playing' ? dt : 0.016);
  if (world && state !== 'playing') { yaw += dt * 0.08; hero.g.position.copy(P.pos); }
  updateFloaters(state === 'playing' ? dt : 0);
  renderer.render(scene, camera);
}
function tick(dt) { clock += dt; T += dt; run.time += dt; updateMovers(); if (P.alive) updatePlayer(dt); updateHazards(dt); updateEnemies(dt); updateProjectiles(dt); updatePickups(dt); }

buildCourse(COURSES[0], 0);
P.pos.set(...COURSES[0].start); hero.g.position.copy(P.pos);
window.__mythrun = { get state() { return state; }, P, keys, press, tick, get clock() { return clock; }, get world() { return world; }, get run() { return run; }, save: () => save, startCourse, finishCourse, killEnemy };
showTitle();
requestAnimationFrame(frame);
})();
